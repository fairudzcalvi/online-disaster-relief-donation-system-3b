<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Campaigns - BayanihanRelief</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/campaigns.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon">
                    <i class="fas fa-hands-helping"></i>
                </div>
                <span class="brand-name">BayanihanRelief</span>
            </a>
            
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html#mission" class="nav-link">Mission</a>
                <a href="campaign.html" class="nav-link active">Campaigns</a>
                <a href="organizations.html" class="nav-link">Organizations</a>
                <a href="index.html#how-it-works" class="nav-link">How It Works</a>
                <a href="index.html#why-support" class="nav-link">Why Support</a>
                <a href="about.html" class="nav-link">About</a>
            </div>

            <div class="nav-actions">
                <a href="donation-page.html" class="btn btn-primary">Donate Now</a>
            </div>

            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="page-hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="page-title">Active Relief Campaigns</h1>
                <p class="page-subtitle">Support verified organizations and track exactly how your donation helps communities</p>
            </div>
        </div>
    </section>

    <!-- Campaigns Section -->
    <section class="campaigns-section">
        <div class="container">
            <div class="campaigns-grid" id="campaignsGrid">
                <p style="text-align:center;color:var(--text-light);padding:40px;grid-column:1/-1;">
                    <i class="fas fa-spinner fa-spin" style="font-size:24px;margin-bottom:12px;display:block;"></i>
                    Loading campaigns...
                </p>
            </div>
        </div>
    </section>

    <!-- Campaign Details Modal -->
    <div class="modal" id="campaignModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Campaign Details</h2>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content will be loaded here -->
            </div>
        </div>
    </div>

    <script src="assets/js/campaigns.js"></script>
    <script src="assets/js/shared/admin-shortcut.js"></script>
    <script>
        // Navbar scroll + mobile toggle
        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
        });
        const navToggle = document.getElementById('navToggle');
        const navMenu = document.getElementById('navMenu');
        if (navToggle && navMenu) {
            navToggle.addEventListener('click', () => navMenu.classList.toggle('active'));
            document.addEventListener('click', e => {
                if (!navMenu.contains(e.target) && !navToggle.contains(e.target)) {
                    navMenu.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
